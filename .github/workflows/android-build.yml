name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Checkout v4 source for Room schema export
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy-v4

      - name: Generate legacy v4 Room schema
        working-directory: legacy-v4
        run: gradle :app:kaptDebugKotlin --no-daemon

      - name: Copy v4 schema into current build
        run: |
          mkdir -p app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase
          cp legacy-v4/app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/4.json app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/4.json

      - name: Generate current v5 Room schema
        run: gradle :app:kaptDebugKotlin --no-daemon

      - name: Persist exported Room schemas in the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/4.json app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/5.json
          if git diff --cached --quiet; then
            echo "Room schemas are already current."
          else
            git commit -m "chore: persist Room schema snapshots [skip ci]"
            git push origin "HEAD:${PR_BRANCH}"
          fi

      - name: Upload Room schema snapshots
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-room-schemas
          path: app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run database migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
