name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep untrusted build/test code read-only. Grant write access only to the
# isolated schema-persistence job, which runs after the build has completed.
permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep pull-request builds isolated from signing credentials
        if: github.event_name == 'pull_request'
        run: echo "Pull-request validation builds use the temporary Android debug signature."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Checkout v4 source for Room schema export
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy-v4

      - name: Generate legacy v4 Room schema
        timeout-minutes: 8
        working-directory: legacy-v4
        run: gradle :app:kaptDebugKotlin --no-daemon --console=plain --stacktrace

      - name: Copy v4 schema into current build
        run: |
          mkdir -p app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase
          cp legacy-v4/app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/4.json app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/4.json

      - name: Generate current Room schema
        timeout-minutes: 8
        run: gradle :app:kaptDebugKotlin --no-daemon --console=plain --stacktrace

      - name: Upload Room schema snapshots
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-room-schemas
          path: app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        timeout-minutes: 12
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
            echo "::warning::KVM is unavailable; allowing Android Emulator software CPU emulation."
          else
            echo "KVM hardware acceleration is available."
          fi

      - name: Run Android instrumentation tests (database, accounting, Arabic text input)
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-android-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        timeout-minutes: 8
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: good-girl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  persist-room-schemas:
    name: Persist exported Room schemas
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Download Room schema snapshots
        uses: actions/download-artifact@v4
        with:
          name: good-girl-room-schemas
          path: app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase

      - name: Commit schema snapshots when changed
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.goodgirl.accounting.data.local.AccountingDatabase/*.json
          if git diff --cached --quiet; then
            echo "Room schemas are already current."
          else
            git commit -m "chore: persist Room schema snapshots [skip ci]"
            git push origin "HEAD:${PR_BRANCH}"
          fi
